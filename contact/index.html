  <h1>Contact</h1>

  <!-- mailto: form opens the visitor's email app with a pre-addressed message -->
  <form action="mailto:austinflippo31@gmail.com" method="POST" enctype="text/plain">
    <p>
      <label>
        Your email:
        <input type="email" name="email" required>
      </label>
    </p>
    <p>
      <label>
        Subject:
        <input type="text" name="subject">
      </label>
    </p>
    <p>
      <label>
        Message:
        <textarea name="message" rows="5" required></textarea>
      </label>
    </p>
    <p>
      <button type="submit">Send</button>
    </p>
  </form>
</body>
